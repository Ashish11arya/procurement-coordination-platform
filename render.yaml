# ==============================================================================
# Render Blueprint Specification (Infrastructure as Code)
# National Procurement Coordination Platform (Startup Fast-Launch Tier)
# ==============================================================================

version: "1"

services:
  # ----------------------------------------------------------------------------
  # Unified Fullstack Web Service (NestJS API + Socket.IO + React SPA)
  # ----------------------------------------------------------------------------
  - type: web
    name: procurement-coordination-platform
    runtime: node
    plan: starter # $7/mo (always-on, 512MB RAM, no cold sleeps) or change to 'free'
    region: oregon
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && npm --prefix backend install && npm --prefix backend run build
    startCommand: node backend/dist/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_NAME
        value: ProcurementCoordinationPlatform
      - key: API_PREFIX
        value: api/v1
      
      # Public CORS Origin (Update with your live Render URL or custom domain)
      - key: CORS_ORIGIN
        value: https://procurement-coordination-platform.onrender.com,http://localhost:5173,http://localhost:3000
      
      # Managed Databases (Populate in Render Dashboard > Environment)
      # MongoDB Atlas Free M0 SRV URI: mongodb+srv://<user>:<password>@<cluster>.mongodb.net/procurement_prod
      - key: MONGODB_URI
        sync: false
      
      # Upstash Serverless Redis TLS URL: rediss://default:<token>@<endpoint>.upstash.io:6379
      - key: REDIS_URL
        sync: false
      
      # Cryptographic JWT Secrets (Render generates strong random secrets automatically)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # Security & Rate Limiting Controls
      - key: OTP_TTL_SECONDS
        value: 300
      - key: OTP_MAX_ATTEMPTS
        value: 3
      - key: OTP_THROTTLE_WINDOW_SECONDS
        value: 600
      - key: RATE_LIMIT_TTL
        value: 60
      - key: RATE_LIMIT_MAX
        value: 100

      # Government Integration Provider (MOCK for demo/testing, ESAMRIDHI for live national portal)
      - key: GOVERNMENT_PROVIDER
        value: MOCK
      - key: MOCK_GOV_LATENCY_MS
        value: 150
      - key: ESAMRIDHI_API_BASE_URL
        value: https://api.esamridhi.gov.in/v1
      - key: ESAMRIDHI_CLIENT_ID
        sync: false
      - key: ESAMRIDHI_CLIENT_SECRET
        sync: false
      - key: ESAMRIDHI_API_KEY
        sync: false
      - key: ESAMRIDHI_TIMEOUT_MS
        value: 5000
